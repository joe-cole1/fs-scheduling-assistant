name: Validate operator packages

on:
  pull_request:
    paths:
      - '.github/workflows/validate-packages.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'templates/**'
      - 'local-profiles/**'
      - 'examples/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/validate-packages.yml'
      - 'packaging/**'
      - 'scripts/**'
      - 'tests/**'
      - 'docs/**'
      - 'templates/**'
      - 'local-profiles/**'
      - 'examples/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  packages:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out package sources and history
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
      - name: Install pinned packaging dependencies
        run: python -m pip install --disable-pip-version-check -r packaging/requirements.txt
      - name: Validate persistent-state declarations
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [ -n "${BASE_SHA:-}" ]; then
            args+=(--base "$BASE_SHA")
          fi
          python scripts/check_persistent_migrations.py "${args[@]}"
      - name: Build operator downloads
        run: python scripts/build_packages.py --output "$RUNNER_TEMP/package-output"
      - name: Check package integrity and source coverage
        run: python scripts/check_packages.py "$RUNNER_TEMP/package-output"
      - name: Run release and packaging regression tests
        run: python -m unittest discover -s tests -v
