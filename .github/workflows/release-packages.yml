name: Publish release

run-name: Publish ${{ inputs.version || 'next patch release' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version, e.g. 0.5.4. Leave blank to increment the latest published stable release by 0.0.1.'
        required: false
        default: ''
        type: string

permissions:
  contents: read

# Serialize every publication so a blank auto-version run cannot race an explicit version run.
concurrency:
  group: publish-release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: write # Create the draft/tag, upload assets, write notes, then publish.
    env:
      RELEASE_VERSION: ${{ inputs.version }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
      WORKFLOW_REF_NAME: ${{ github.ref_name }}
    steps:
      - name: Set temporary build paths
        shell: bash
        run: |
          echo "PACKAGE_OUTPUT=$RUNNER_TEMP/release-packages-a" >> "$GITHUB_ENV"
          echo "PACKAGE_OUTPUT_B=$RUNNER_TEMP/release-packages-b" >> "$GITHUB_ENV"
          echo "RELEASE_STATE=$RUNNER_TEMP/release-state.json" >> "$GITHUB_ENV"

      - name: Check out release tooling from the default branch
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up exact packaging Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'

      - name: Resolve version and validate release slot
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_release.py

      - name: Check out the exact source commit to release
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: release-source
          persist-credentials: false

      - name: Apply the resolved version to the disposable build workspace
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PACKAGE_VERSION" > release-source/packaging/version.txt

      - name: Install pinned packaging dependencies
        run: python -m pip install --disable-pip-version-check -r '${{ steps.release.outputs.requirements_path }}'

      - name: Validate persistent-state declarations
        run: python release-source/scripts/check_persistent_migrations.py

      - name: Build operator downloads twice
        shell: bash
        run: |
          set -euo pipefail
          python release-source/scripts/build_packages.py --output "$PACKAGE_OUTPUT"
          python release-source/scripts/build_packages.py --output "$PACKAGE_OUTPUT_B"

      - name: Check package integrity and source coverage
        run: python release-source/scripts/check_packages.py "$PACKAGE_OUTPUT"

      - name: Verify byte-reproducible downloads
        shell: bash
        run: |
          set -euo pipefail
          for file in Pantons_Setup.zip First_Time_Squadron_Setup.zip Update_Existing_Setup.zip manifest.json; do
            cmp "$PACKAGE_OUTPUT/downloads/$file" "$PACKAGE_OUTPUT_B/downloads/$file"
          done

      - name: Run release and packaging regression tests
        run: python -m unittest discover -s release-source/tests -v

      - name: Create draft, attach and verify assets, then publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_packages.py publish

      - name: Explain a failed publication
        if: failure()
        shell: bash
        run: |
          echo '### Release publication needs attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'No published release is intentionally modified by this workflow.' >> "$GITHUB_STEP_SUMMARY"
          echo 'If failure occurred before draft creation, rerun after fixing the cause. If a matching draft exists, rerunning the same resolved version resumes that draft and verifies existing asset bytes before uploading anything missing.' >> "$GITHUB_STEP_SUMMARY"
          echo 'Do not publish the draft manually while this workflow is incomplete. See packaging/README.md.' >> "$GITHUB_STEP_SUMMARY"
