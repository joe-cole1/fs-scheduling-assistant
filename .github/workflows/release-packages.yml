name: Build release downloads

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing published release tag, for example v0.5.0'
        required: true
        type: string

# No branch writes, PR writes, package registry or personal access token.
permissions:
  contents: read

concurrency:
  group: release-downloads-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write # Attach files and update release notes only; scripts never push.
    env:
      RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - name: Set temporary build paths
        shell: bash
        run: |
          echo "PACKAGE_OUTPUT=$RUNNER_TEMP/release-packages" >> "$GITHUB_ENV"
          echo "RELEASE_STATE=$RUNNER_TEMP/release-state.json" >> "$GITHUB_ENV"
      # Controller comes from the default branch so a failed already-published
      # release can be recovered without moving/recreating its immutable tag.
      - name: Check out release tooling
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up exact packaging Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12.14'
      - name: Check release, tag and tagged build contract
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/prepare_release.py
      - name: Check out the exact released source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ steps.release.outputs.source_sha }}
          path: release-source
          persist-credentials: false
      - name: Apply authoritative release version to build workspace
        env:
          PACKAGE_VERSION: ${{ steps.release.outputs.package_version }}
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "$PACKAGE_VERSION" > release-source/packaging/version.txt
      - name: Install tagged or frozen legacy dependencies
        run: python -m pip install --disable-pip-version-check -r '${{ steps.release.outputs.requirements_path }}'
      - name: Build Word documents and ZIPs from the tag
        run: python release-source/scripts/build_packages.py --output "$PACKAGE_OUTPUT"
      - name: Check packages and update preservation
        run: python release-source/scripts/check_packages.py "$PACKAGE_OUTPUT"
      - name: Verify and attach downloads; update release notes
        env:
          GH_TOKEN: ${{ github.token }}
        run: python scripts/release_packages.py publish
      - name: Explain a failed build
        if: failure()
        run: |
          echo '### Release downloads need attention' >> "$GITHUB_STEP_SUMMARY"
          echo 'The release may be visible with missing assets. Inspect the failed step and rerun this workflow for the same tag. Existing different files are never overwritten. See packaging/README.md.' >> "$GITHUB_STEP_SUMMARY"
