name: Validate GitHub workflows

on:
  pull_request:
    paths:
      - '.github/workflows/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  actionlint:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Check out the proposed workflows
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Validate GitHub Actions expressions and workflow structure
        shell: bash
        run: |
          set -euo pipefail
          lint_dir="$RUNNER_TEMP/actionlint"
          mkdir -p "$lint_dir"
          curl --fail --silent --show-error --location --retry 2 --max-time 90 \
            https://github.com/rhysd/actionlint/releases/download/v1.7.7/actionlint_1.7.7_linux_amd64.tar.gz \
            --output "$lint_dir/actionlint.tar.gz"
          echo '023070a287cd8cccd71515fedc843f1985bf96c436b7effaecce67290e7e0757  actionlint.tar.gz' \
            | (cd "$lint_dir" && sha256sum --check --strict)
          tar --no-same-owner -xzf "$lint_dir/actionlint.tar.gz" -C "$lint_dir" actionlint
          "$lint_dir/actionlint" -color -shellcheck= -pyflakes= .github/workflows/*.yml
